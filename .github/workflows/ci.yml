name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest
      - run: python -m pytest -q

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export YOLO26 pose model to ONNX
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics onnx onnxslim onnxruntime
          python scripts/export_android_model.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: BabySleepDetect-apk
          path: android/app/build/outputs/apk/release/*.apk
